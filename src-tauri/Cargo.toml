[package]
name = "voxis-mic-control"
version = "2.1.0"
description = "A microphone control utility for Windows"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
cpal = "0.18.2"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", version = "0.5.7-pre", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
nnnoiseless = { version = "0.5.2", default-features = false }
windows-core = "0.61.2"
windows = { version = "0.61.3", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_Devices_Properties", "Win32_Devices_FunctionDiscovery", "Win32_Storage_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader"] }

# tract-core trips a debug_assertions duplicate-node check during deepfilternet codegen if debug-assertions is enabled
[profile.dev]
debug-assertions = false

[profile.dev.package."*"]
opt-level = 2
